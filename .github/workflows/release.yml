# .github/workflows/release.yml
# Deploys production when a GitHub Release is published. Auto-deploys on the
# develop branch are disabled in vercel.json, so this is the sole path to prod.
# Publish a release (which creates its tag) from the GitHub Releases UI or:
#   gh release create v1.2.3 --title v1.2.3 --notes "..."
# workflow_dispatch is kept for manual re-deploys / debugging.
name: release
on:
  release:
    types: [published]
  workflow_dispatch: {}

# One prod deploy at a time; never cancel an in-flight release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # The team that owns the project (from `vercel link` → luisgoyonees-projects/northmark).
      VERCEL_SCOPE: luisgoyonees-projects
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Identify the token (diagnostic — which account/team can it see?)
        run: vercel whoami --token="$VERCEL_TOKEN" || true

      - name: Pull production project settings
        run: vercel pull --yes --environment=production --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Build for production
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy the prebuilt output to production
        run: vercel deploy --prebuilt --prod --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
